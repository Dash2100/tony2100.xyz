<!-- Post Card -->
<div
    class="pv-text delay-1 w-full h-auto min-h-[200px] md:h-[230px] bg-[#f7fafd] border-[1px] border-[#4E5969]/20 shadow-inner rounded-[25px] md:rounded-[35px] gap-4 py-6 md:py-8 px-6 md:px-9 flex flex-col md:flex-row justify-between group cursor-pointer">
    <div class="flex flex-col justify-between order-2 md:order-1 flex-1">
        <div class="flex flex-col gap-1">
            <h1 class="text-[#4E5969] text-[20px] md:text-[25px] font-medium noto-font">
                {=$title}
            </h1>

            <div class="flex lg:flex-row flex-col gap-1 lg:gap-3 mb-3 lg:mb-0">

                <!-- Date -->
                <div class="flex gap-1">
                    <img src="./imgs/icon/date.svg" alt="Calendar Icon" class="h-5 w-5 my-auto">
                    <p class="text-[#4E5969] text-[15px] noto-font font-medium my-auto">2025 年
                        07 月
                        24日</p>
                </div>

                <!-- Line Between -->
                <div class="w-[2px] h-[18px] my-auto bg-[#4E5969] hidden lg:block"></div>

                <!-- Word count -->
                <div class="flex gap-1">
                    <img src="./imgs/icon/words.svg" alt="Word Count Icon" class="h-5 w-5 my-auto">
                    <p class="text-[#4E5969] text-[15px] noto-font font-medium my-auto">5050 個字
                    </p>
                </div>

            </div>
        </div>

        <!-- Tags -->
        <div class="flex gap-2 w-full flex-wrap">
            <span class="bg-[#DBECF8] text-[#4E5969] px-3 py-1 rounded-[10px] text-[15px] shadow-inner">
                <img src="./imgs/icon/pin.svg" alt="Tag Icon" class="inline my-auto" />
                置頂
            </span>
            <span class="bg-[#DBECF8] text-[#4E5969] px-3 py-1 rounded-[10px] text-[15px] shadow-inner">
                競賽
            </span>
        </div>
    </div>

    <!-- Cover Image -->
    <div
        class="w-full md:w-[280px] h-[180px] md:h-auto bg-[#DBECF8] rounded-[20px] shadow-inner overflow-hidden order-1 md:order-2 flex-shrink-0">
        <img src="./imgs/cover-default.png" alt="Post Cover Image"
            class="w-full h-full object-cover rounded-[20px] transition-transform duration-300 ease-in-out lg:group-hover:scale-[1.02]">
    </div>
</div>
